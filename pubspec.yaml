name: cloudsbin
description: "CloudsBin mobile app — user + admin client for the /api/v1 contract."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP + interceptors
  dio: ^5.4.0

  # Secure token storage (never SharedPreferences for secrets)
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # State management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.0

  # Immutable models + serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Display helpers
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Device identity, idempotency keys, version header, file picking
  uuid: ^4.4.0
  package_info_plus: ^8.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
